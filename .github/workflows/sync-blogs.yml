name: Sync Mr Glowra Blogs

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Import blogs from mrglowra.com
        run: npm run sync:blogs

      - name: Commit imported articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blogs package-lock.json
          git diff --cached --quiet || git commit -m "chore: sync Mr Glowra blogs"
          git push
